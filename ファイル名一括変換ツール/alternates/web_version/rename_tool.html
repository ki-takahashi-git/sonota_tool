<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ファイル名一括変換ツール</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Yu Gothic UI', 'Meiryo', sans-serif; background: #f0f4f8; color: #333; height: 100vh; display: flex; flex-direction: column; }

header { background: #2c5f8a; color: white; padding: 14px 24px; flex-shrink: 0; }
header h1 { font-size: 17px; font-weight: bold; }
header p  { font-size: 11px; color: #aed6f1; margin-top: 3px; }

main { flex: 1; padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }

.card { background: white; border-radius: 8px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); flex-shrink: 0; }
.card-label { font-size: 11px; font-weight: bold; color: #666; margin-bottom: 8px; }

.folder-row { display: flex; gap: 8px; }
.folder-input { flex: 1; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 13px; background: #f9f9f9; min-width: 0; }

.btn { padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: bold; white-space: nowrap; transition: filter .15s; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:not(:disabled):hover { filter: brightness(1.1); }
.btn-blue   { background: #2c5f8a; color: white; }
.btn-green  { background: #27ae60; color: white; }
.btn-orange { background: #e67e22; color: white; }
.btn-gray   { background: #7f8c8d; color: white; }

.opts { display: flex; gap: 20px; }
.opt-label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
.dry-label { color: #c0392b; font-weight: bold; }

.btn-row { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.ml-auto { margin-left: auto; }

.progress { height: 3px; background: #e0e0e0; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
.progress-bar { height: 100%; background: #2c5f8a; width: 0; }
.progress-bar.run { animation: slide 1s ease-in-out infinite; }
@keyframes slide { 0%{transform:translateX(-100%);width:40%} 100%{transform:translateX(300%);width:40%} }

.table-card { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); min-height: 0; }
.table-wrap { overflow: auto; flex: 1; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: #f0f4f8; padding: 8px 10px; text-align: left; font-weight: bold; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
tbody td { padding: 5px 10px; border-bottom: 1px solid #f0f0f0; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr.is-folder { background: #f0f7ff; }
.center { text-align: center; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: bold; }
.bf { background: #e8f5e9; color: #2e7d32; }
.bd { background: #e3f2fd; color: #1565c0; }
.arrow { color: #bbb; text-align: center; width: 24px; }
.new-name { color: #1a6e2e; font-weight: bold; }
.path-cell { color: #999; font-size: 11px; }
.empty { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }

.status { background: white; border-top: 1px solid #e0e0e0; padding: 7px 20px; font-size: 12px; color: #666; flex-shrink: 0; }

.warn { background: #fff8e1; border: 1px solid #ffc107; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #7a5f00; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <h1>📁 ファイル名一括変換ツール</h1>
  <p>カナ全角・英数半角 ガイドライン準拠版 — ブラウザ版（Chrome / Edge）</p>
</header>

<main>
  <div id="compatWarn" class="warn" style="display:none">
    ⚠️ このツールは Chrome または Edge (109以降) が必要です。フォルダ選択・実行機能が使えない場合があります。
  </div>

  <div class="card">
    <div class="card-label">対象フォルダ</div>
    <div class="folder-row">
      <input class="folder-input" id="folderInput" readonly placeholder="フォルダを選択してください...">
      <button class="btn btn-blue" id="btnSelect">📁 フォルダを選択</button>
    </div>
  </div>

  <div class="card" style="padding:10px 16px">
    <div class="opts">
      <label class="opt-label">
        <input type="checkbox" id="chkRecursive" checked> サブフォルダも対象にする
      </label>
      <label class="opt-label dry-label">
        <input type="checkbox" id="chkDryRun" checked> テストモード（実際には変更しない）
      </label>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-green"  id="btnScan" disabled>🔍 スキャン（プレビュー）</button>
    <button class="btn btn-orange" id="btnExec" disabled>▶ 実行</button>
    <button class="btn btn-gray ml-auto" id="btnCsv" disabled>💾 CSVで保存</button>
  </div>

  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <div class="table-card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="center" style="width:72px">種別</th>
            <th>変更前</th>
            <th class="arrow" style="width:24px"></th>
            <th>変更後</th>
            <th>フォルダパス</th>
          </tr>
        </thead>
        <tbody id="previewBody">
          <tr><td colspan="5" class="empty">フォルダを選択してスキャンしてください</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="status" id="statusBar">準備完了</div>

<script>
// ════════════════════════════════════════════
//  変換ロジック
// ════════════════════════════════════════════

const HK = {'ｦ':'ヲ','ｧ':'ァ','ｨ':'ィ','ｩ':'ゥ','ｪ':'ェ','ｫ':'ォ','ｬ':'ャ','ｭ':'ュ','ｮ':'ョ','ｯ':'ッ','ｰ':'ー','ｱ':'ア','ｲ':'イ','ｳ':'ウ','ｴ':'エ','ｵ':'オ','ｶ':'カ','ｷ':'キ','ｸ':'ク','ｹ':'ケ','ｺ':'コ','ｻ':'サ','ｼ':'シ','ｽ':'ス','ｾ':'セ','ｿ':'ソ','ﾀ':'タ','ﾁ':'チ','ﾂ':'ツ','ﾃ':'テ','ﾄ':'ト','ﾅ':'ナ','ﾆ':'ニ','ﾇ':'ヌ','ﾈ':'ネ','ﾉ':'ノ','ﾊ':'ハ','ﾋ':'ヒ','ﾌ':'フ','ﾍ':'ヘ','ﾎ':'ホ','ﾏ':'マ','ﾐ':'ミ','ﾑ':'ム','ﾒ':'メ','ﾓ':'モ','ﾔ':'ヤ','ﾕ':'ユ','ﾖ':'ヨ','ﾗ':'ラ','ﾘ':'リ','ﾙ':'ル','ﾚ':'レ','ﾛ':'ロ','ﾜ':'ワ','ﾝ':'ン'};
const DK = {'カ':'ガ','キ':'ギ','ク':'グ','ケ':'ゲ','コ':'ゴ','サ':'ザ','シ':'ジ','ス':'ズ','セ':'ゼ','ソ':'ゾ','タ':'ダ','チ':'ヂ','ツ':'ヅ','テ':'デ','ト':'ド','ハ':'バ','ヒ':'ビ','フ':'ブ','ヘ':'ベ','ホ':'ボ','ウ':'ヴ'};
const HD = {'ハ':'パ','ヒ':'ピ','フ':'プ','ヘ':'ペ','ホ':'ポ'};
const RULES = [['－','-'],['※','注'],['①','_1'],['②','_2'],['③','_3'],['④','_4'],['⑤','_5'],['⑥','_6'],['⑦','_7'],['⑧','_8'],['⑨','_9'],['（','('],['）',')'],['【','('],['】',')'],['［','('],['］',')'],['『','('],['』',')'],['｛','('],['｝',')'],['〈','('],['〉',')'],['＜','('],['＞',')']];
const ALLOWED = /^[ぁ-んァ-ヶa-zA-Z0-9ー()_一-龥々\-△]$/;

function h2z(s) {
  const a=[...s], r=[]; let i=0;
  while(i<a.length){
    const c=a[i], z=HK[c];
    if(z){ const n=a[i+1]; if(n==='ﾞ'&&DK[z]){r.push(DK[z]);i+=2;continue;} if(n==='ﾟ'&&HD[z]){r.push(HD[z]);i+=2;continue;} r.push(z); } else r.push(c);
    i++;
  }
  return r.join('');
}

function z2h(s){
  return [...s].map(c=>{const v=c.codePointAt(0);if(v>=0xFF10&&v<=0xFF19)return String.fromCodePoint(v-0xFF10+0x30);if(v>=0xFF21&&v<=0xFF3A)return String.fromCodePoint(v-0xFF21+0x41);if(v>=0xFF41&&v<=0xFF5A)return String.fromCodePoint(v-0xFF41+0x61);return c;}).join('');
}

function newName(name, isFile){
  let raw, ext;
  if(isFile){ const d=name.lastIndexOf('.'); raw=d>0?name.slice(0,d):name; ext=d>0?name.slice(d):''; }
  else { raw=name; ext=''; }
  raw=h2z(raw); raw=z2h(raw);
  for(const[f,t]of RULES) raw=raw.split(f).join(t);
  raw=[...raw].map(c=>ALLOWED.test(c)?c:'_').join('');
  while(raw.includes('__')) raw=raw.split('__').join('_');
  raw=raw.replace(/^[ _()\-△]+/,'').replace(/_+$/,'');
  if(!raw.trim()) raw='renamed_'+String(Date.now()).slice(-4);
  return raw+ext;
}

// ════════════════════════════════════════════
//  UI
// ════════════════════════════════════════════

const $ = id => document.getElementById(id);
const btnSelect=$('btnSelect'), btnScan=$('btnScan'), btnExec=$('btnExec'), btnCsv=$('btnCsv');
const folderInput=$('folderInput'), chkRec=$('chkRecursive'), chkDry=$('chkDryRun');
const tbody=$('previewBody'), status=$('statusBar'), progBar=$('progressBar');

let rootHandle=null, items=[];

if(!('showDirectoryPicker' in window)) $('compatWarn').style.display='block';

function setStatus(msg){ status.textContent=msg; }
function setBusy(b){
  progBar.className='progress-bar'+(b?' run':'');
  btnSelect.disabled=b; btnScan.disabled=b||!rootHandle;
  btnExec.disabled=b||!items.length; btnCsv.disabled=b||!items.length;
}

function render(list){
  if(!list.length){ tbody.innerHTML='<tr><td colspan="5" class="empty">変更が必要なファイル・フォルダはありませんでした</td></tr>'; return; }
  tbody.innerHTML=list.map(it=>{
    const dir=it.path.includes('/')?it.path.slice(0,it.path.lastIndexOf('/')):'(ルート)';
    const badge=it.isFile?'<span class="badge bf">ファイル</span>':'<span class="badge bd">フォルダ</span>';
    return `<tr${it.isFile?'':' class="is-folder"'}><td class="center">${badge}</td><td title="${it.name}">${it.name}</td><td class="arrow">→</td><td class="new-name" title="${it.nn}">${it.nn}</td><td class="path-cell" title="${dir}">${dir}</td></tr>`;
  }).join('');
}

// ── フォルダ選択 ──────────────────────────
btnSelect.addEventListener('click', async()=>{
  try{
    rootHandle=await window.showDirectoryPicker({mode:'readwrite'});
    folderInput.value=rootHandle.name;
    btnScan.disabled=false; btnExec.disabled=true; btnCsv.disabled=true;
    tbody.innerHTML='<tr><td colspan="5" class="empty">スキャンボタンを押してください</td></tr>';
    setStatus('「'+rootHandle.name+'」を選択しました');
  }catch(e){ if(e.name!=='AbortError') setStatus('エラー: '+e.message); }
});

// ── スキャン ──────────────────────────────
btnScan.addEventListener('click', async()=>{
  if(!rootHandle) return;
  setBusy(true); items=[];
  tbody.innerHTML='<tr><td colspan="5" class="empty">スキャン中...</td></tr>';
  setStatus('スキャン中...');
  try{
    const rec=chkRec.checked, buf=[];
    async function walk(dir, path, depth){
      for await(const[name,h]of dir.entries()){
        const p=path?`${path}/${name}`:name, isFile=h.kind==='file', nn=newName(name,isFile);
        if(name!==nn) buf.push({h, parentH:dir, name, nn, path:p, isFile, depth});
        if(!isFile&&rec) await walk(h,p,depth+1);
      }
    }
    await walk(rootHandle,'',0);
    buf.sort((a,b)=>b.depth-a.depth||(a.isFile?0:1)-(b.isFile?0:1));
    items=buf; render(items);
    const mode=chkDry.checked?'【テストモード】':'【本番モード】';
    setStatus(mode+' '+items.length+' 件が変換対象です');
  }catch(e){
    setStatus('スキャンエラー: '+e.message);
    tbody.innerHTML=`<tr><td colspan="5" class="empty" style="color:red">${e.message}</td></tr>`;
  }finally{ setBusy(false); btnExec.disabled=!items.length; btnCsv.disabled=!items.length; }
});

// ── 実行 ──────────────────────────────────
btnExec.addEventListener('click', async()=>{
  if(!items.length) return;
  const dry=chkDry.checked;
  if(!confirm(`${items.length} 件を処理します。\n現在: ${dry?'テストモード（変更なし）':'本番モード（実際にリネームします）'}\n\n続けますか？`)) return;
  setBusy(true); setStatus('処理中...');
  let done=0, errs=[];
  for(const it of items){
    try{
      if(!dry){
        if(typeof it.h.move==='function'){ await it.h.move(it.nn); }
        else if(it.isFile){
          const file=await it.h.getFile();
          const nh=await it.parentH.getFileHandle(it.nn,{create:true});
          const w=await nh.createWritable(); await w.write(await file.arrayBuffer()); await w.close();
          await it.parentH.removeEntry(it.name);
        } else { errs.push(it.name+': フォルダのリネームはこのブラウザ未対応'); continue; }
      }
      done++;
    }catch(e){ errs.push(it.name+': '+e.message); }
  }
  setBusy(false);
  const msg=dry?`テスト完了: ${done} 件確認`:`完了: ${done} 件リネームしました`;
  setStatus(msg+(errs.length?` (エラー ${errs.length} 件)`:''));
  alert(msg+(errs.length?'\n\nエラー:\n'+errs.slice(0,5).join('\n'):''));
  if(!dry) btnExec.disabled=true;
});

// ── CSV保存 ───────────────────────────────
btnCsv.addEventListener('click',()=>{
  if(!items.length) return;
  const rows=[['種別','変更前','変更後','フォルダパス']];
  for(const it of items){ const d=it.path.includes('/')?it.path.slice(0,it.path.lastIndexOf('/')):''; rows.push([it.isFile?'ファイル':'フォルダ',it.name,it.nn,d]); }
  const csv='﻿'+rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\r\n');
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),download:`RenameLog_${new Date().toISOString().slice(0,16).replace(/[T:]/g,'')}.csv`});
  a.click(); setStatus('CSVを保存しました');
});
</script>
</body>
</html>
