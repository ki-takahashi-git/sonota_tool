<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単価マスター メンテナンスツール</title>
<style>
  :root{ --navy:#1f3864; --blue:#2e75b6; --warn:#c0392b; --warnbg:#fde9e7; --okbg:#e7f5ec; --ok:#1a7f37; --line:#e2e8f0; --line2:#cfd8e3; --bg:#f6f8fb; --muted:#6b7480; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Yu Gothic","Meiryo",sans-serif;color:#2a2f36;background:var(--bg);font-size:13px;line-height:1.5}
  header{background:var(--navy);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:12px}
  header h1{font-size:15px;margin:0;font-weight:700}
  #mode{font-size:11px;padding:2px 9px;border-radius:10px;background:#fff;color:var(--navy);font-weight:700}
  #status{font-size:11px;opacity:.85;margin-left:auto}
  .tabs{display:flex;gap:6px;background:#fff;padding:0 16px;border-bottom:1px solid var(--line2)}
  .tab{padding:10px 20px;cursor:pointer;background:transparent;border:none;border-bottom:3px solid transparent;margin-top:2px;font-weight:700;color:var(--muted);font-size:13px}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 18px;max-width:1180px}
  input,select,button{font-family:inherit;font-size:13px}
  input[type=text],input[type=number],input[type=date]{padding:7px 10px;border:1px solid var(--line2);border-radius:6px;background:#fff}
  input[type=text]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(46,117,182,.15)}
  button{padding:7px 15px;border:none;border-radius:6px;background:var(--blue);color:#fff;cursor:pointer;font-weight:700}
  button.sec{background:#fff;color:var(--blue);border:1px solid var(--line2)}
  button.ghost{background:transparent;color:var(--muted);border:none;padding:4px 8px;font-weight:400;text-decoration:underline;cursor:pointer}
  button:hover{filter:brightness(.97)}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .toolbar .grow{flex:1}
  #kw{width:100%;max-width:460px}
  .subbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;color:var(--muted);font-size:12px;flex-wrap:wrap}
  .subbar label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .selpill{margin-left:auto;background:var(--okbg);color:var(--ok);font-weight:700;padding:4px 12px;border-radius:14px}

  /* group cards */
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .ghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#fafcfe;border-bottom:1px solid var(--line)}
  .ghead .code{font-weight:700;color:var(--navy);font-size:14px}
  .ghead .name{color:#3a424c}
  .chip{font-size:11px;padding:2px 9px;border-radius:11px;background:#eef3f9;color:#3a4a5e}
  .chip b{color:var(--navy)}
  .badge{font-size:11px;padding:2px 9px;border-radius:11px;font-weight:700;cursor:help}
  .badge.w{background:var(--warnbg);color:var(--warn)}
  .spacer{flex:1}

  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{background:#f1f5fa;color:var(--navy);font-weight:700;border-bottom:1px solid var(--line2)}
  tbody tr:hover td{background:#f7fafd}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .inf{color:var(--warn);font-weight:700}
  .zero{color:var(--warn);font-weight:700}
  .nomatch{color:var(--warn);font-weight:700}
  .match{color:var(--ok)}
  .selcell{text-align:center;width:38px}
  .hint{color:var(--muted);font-size:12px}
  .tablewrap{max-height:60vh;overflow:auto}
  .gen-input{width:88px}
  .csvout{white-space:pre;font-family:Consolas,monospace;font-size:11px;background:#0d1b2a;color:#cfe;padding:10px;border-radius:6px;max-height:30vh;overflow:auto}
  .grp{margin:14px 0 6px;font-weight:700;color:var(--navy);font-size:13px}
  code{background:#eef3f9;padding:1px 5px;border-radius:4px;font-family:Consolas,monospace}
  .kbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:10px}
  .right{margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>単価マスター メンテナンスツール</h1>
  <span id="mode">—</span>
  <span id="status"></span>
</header>
<div class="tabs">
  <button class="tab active" data-t="view">① 現行登録 閲覧</button>
  <button class="tab" data-t="gen">② 一括登録CSV生成</button>
</div>
<main>

<!-- ===== 閲覧 ===== -->
<section id="view">
  <div class="toolbar">
    <input type="text" id="kw" placeholder="アイテムコード / メーカー品目コード / 品名 / 発注先(名称・コード) で検索" onkeydown="if(event.key==='Enter')search()">
    <button onclick="search()">検索</button>
    <button class="sec" onclick="document.getElementById('kw').value='';search()">全件</button>
    <span class="selpill" id="selCount">選択 0件</span>
    <button class="sec" onclick="clearSel()">選択クリア</button>
  </div>
  <div class="subbar">
    <label><input type="checkbox" id="onlyWarn" onchange="render()"> 警告のある品目だけ表示</label>
    <span><span class="inf">無</span> = 適用終了が無期限(99/99/99)</span>
    <span style="color:var(--warn)">赤字 = 要注意（MOQ不一致 / 0円）</span>
    <button class="ghost right" onclick="showCols()">DB項目を表示</button>
  </div>
  <div id="viewResult"><p class="hint">検索語を入れて「検索」、または「全件」を押してください。</p></div>
</section>

<!-- ===== 一括登録CSV生成 ===== -->
<section id="gen" style="display:none">
  <div class="kbar">
    <strong>文字コード</strong>
    <select id="enc"><option value="cp932">Shift-JIS (cp932) ※TPiCS標準</option><option value="utf-8-sig">UTF-8(BOM)</option></select>
    <button class="sec" onclick="clearSel()">選択クリア</button>
  </div>

  <!-- A. Excel往復（推奨） -->
  <div class="card" style="padding:14px;margin-bottom:14px">
    <div style="font-weight:700;color:var(--navy);margin-bottom:8px">Excel往復（推奨）— 改定見積を見ながらExcelで記入</div>
    <p class="hint" id="genCount" style="margin:0 0 10px"></p>
    <div style="display:flex;flex-wrap:wrap;gap:18px">
      <div style="flex:1;min-width:300px">
        <div style="font-weight:700;margin-bottom:4px">手順1：現行をExcel出力</div>
        <p class="hint" style="margin:0 0 8px">①で選んだ品目の<strong>現行の全ロット行（TID付き）</strong>を書き出します（取りこぼし防止）。</p>
        <button onclick="exportXlsx()">現行をExcelに出力</button>
        <span id="expMsg" class="hint"></span>
      </div>
      <div style="flex:1;min-width:300px">
        <div style="font-weight:700;margin-bottom:4px">手順2：記入したExcelを取込む</div>
        <p class="hint" style="margin:0 0 8px">Excelの「改定単価」「改定日」を記入（数量変更時のみ「新適用数量」）。区分は通常「価格改定」。</p>
        <input type="file" id="xlsxfile" accept=".xlsx">
        <button onclick="importXlsx()">取込んでCSV化</button>
      </div>
    </div>
    <div id="importPreview" style="margin-top:12px"></div>
    <div class="toolbar" style="margin-top:8px">
      <button id="impDlBtn" onclick="downloadImportCsv()" disabled>CSVダウンロード</button>
      <span id="impMsg" class="hint"></span>
    </div>
  </div>

  <!-- B. 個別入力（少数向け） -->
  <details>
    <summary style="cursor:pointer;font-weight:700;color:var(--navy)">個別入力（少数のときはこちら）</summary>
    <div class="kbar" style="margin-top:8px">
      <strong>改定日</strong> <input type="date" id="kaitei">
      <button class="sec" onclick="applyDateAll()">改定日を全行へ適用</button>
    </div>
    <div id="genTable"></div>
    <div class="toolbar" style="margin-top:10px">
      <button onclick="preview()">プレビュー生成</button>
      <button onclick="download()">CSVダウンロード</button>
      <span id="genMsg" class="hint"></span>
    </div>
    <div id="csvPreview"></div>
  </details>
</section>

</main>
<script>
let ROWS=[], SEL={};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtPrice=v=>{ if(v===''||v==null) return ''; const n=Number(String(v).replace(/,/g,'')); return isNaN(n)?String(v):n.toFixed(2); };
function rowKey(r){return r.CODE+'|'+r.VENDOR+'|'+r.TID+'|'+r.TVOL;}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  $('#view').style.display = t.dataset.t==='view'?'block':'none';
  $('#gen').style.display  = t.dataset.t==='gen'?'block':'none';
  if(t.dataset.t==='gen') buildGen();
});

function updateCount(){
  const n=Object.keys(SEL).length;
  const a=document.getElementById('selCount'); if(a) a.textContent='選択 '+n+'件';
}
function clearSel(){
  if(Object.keys(SEL).length && !confirm('選択をすべて解除します。よろしいですか？')) return;
  SEL={}; updateCount(); render();
  if(document.getElementById('gen').style.display!=='none') buildGen();
}

async function loadStatus(){
  try{
    const r=await fetch('/api/status').then(r=>r.json());
    $('#mode').textContent = r.demo?'デモモード':'本番(DB接続)';
    $('#status').textContent = r.msg||'';
    if(r.demo) $('#mode').style.background='#ffe08a';
  }catch(e){ $('#status').textContent='状態取得に失敗'; }
}

async function search(){
  $('#viewResult').innerHTML='<p class="hint">検索中…（DBが混雑していると数十秒かかることがあります）</p>';
  const q=encodeURIComponent($('#kw').value.trim());
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), 70000);
  try{
    const resp=await fetch('/api/search?q='+q,{signal:ctrl.signal});
    clearTimeout(timer);
    let r;
    try{ r=await resp.json(); }
    catch(e){ $('#viewResult').innerHTML='<div class="card" style="padding:12px;color:var(--warn)">サーバー応答の解析に失敗しました（HTTP '+resp.status+'）。起動中のコマンドプロンプトのログをご確認ください。</div>'; return; }
    if(!r.ok){$('#viewResult').innerHTML='<div class="card" style="padding:12px;color:var(--warn)">エラー: '+esc(r.msg)+'</div>';return;}
    ROWS=r.rows; render();
  }catch(e){
    clearTimeout(timer);
    const msg=(e.name==='AbortError')?'検索がタイムアウトしました（70秒）。DBの混雑かネットワークの可能性があります。':'通信エラー: '+esc(e.message);
    $('#viewResult').innerHTML='<div class="card" style="padding:12px;color:var(--warn)">'+msg+'</div>';
  }
}

function render(){
  const onlyWarn=$('#onlyWarn').checked;
  const groups={};
  ROWS.forEach(r=>{(groups[r.CODE+'|'+r.VENDOR]=groups[r.CODE+'|'+r.VENDOR]||[]).push(r);});
  let html='', n=0;
  for(const g in groups){
    const rows=groups[g], r0=rows[0], warns=r0.group_warnings||[];
    if(onlyWarn && warns.length===0) continue;
    n++;
    let badges='';
    warns.forEach(w=>{ const label=String(w).split(/[：:]/)[0]; badges+='<span class="badge w" title="'+esc(w)+'">⚠ '+esc(label)+'</span>'; });
    html+='<div class="card"><div class="ghead">'+
      '<span class="code">'+esc(r0.CODE)+'</span>'+
      '<span class="name">'+esc(r0.NAME||'')+'</span>'+
      (r0.MPN?'<span class="chip">メーカー <b>'+esc(r0.MPN)+'</b></span>':'')+
      '<span class="chip">発注先 <b>'+esc(r0.VENDORNAME||r0.VENDOR)+'</b>'+(r0.VENDORNAME?' <span class="hint">('+esc(r0.VENDOR)+')</span>':'')+'</span>'+
      '<span class="chip">MOQ <b>'+esc(r0.LOTS)+'</b></span>'+
      '<span class="spacer"></span>'+badges+
    '</div><div class="tablewrap"><table><thead><tr>'+
      '<th class="selcell">☑</th><th>TID</th><th>適用開始</th><th>適用終了</th><th class="num">適用数量</th><th class="num">MOQ</th><th class="num">発注単価</th></tr></thead><tbody>';
    rows.forEach(r=>{
      const k=rowKey(r);
      const mc = r.moq_match===true?'match':(r.moq_match===false?'nomatch':'');
      html+='<tr>'+
        '<td class="selcell"><input type="checkbox" data-k="'+esc(k)+'" '+(SEL[k]?'checked':'')+' onchange="toggle(this)"></td>'+
        '<td>'+esc(r.TID)+'</td>'+
        '<td>'+esc(r.TDATE_disp)+'</td>'+
        '<td class="'+(r.EDATE_inf?'inf':'')+'">'+esc(r.EDATE_disp)+'</td>'+
        '<td class="num">'+esc(r.TVOL)+'</td>'+
        '<td class="num '+mc+'">'+esc(r.LOTS)+'</td>'+
        '<td class="num '+(r.is_zero?'zero':'')+'">'+esc(fmtPrice(r.PRICE))+'</td>'+
      '</tr>';
    });
    html+='</tbody></table></div></div>';
  }
  if(n===0) html='<p class="hint">該当データがありません。</p>';
  $('#viewResult').innerHTML=html;
}
function toggle(cb){
  const k=cb.dataset.k, r=ROWS.find(x=>rowKey(x)===k);
  if(cb.checked) SEL[k]=r; else delete SEL[k];
  updateCount();
}

/* ===== ②一括登録 ===== */
function buildGen(){
  updateCount();
  const keys=Object.keys(SEL);
  const gc=document.getElementById('genCount');
  if(keys.length===0){
    if(gc) gc.textContent='';
    $('#genTable').innerHTML='<div class="card" style="padding:14px" class="hint">①の閲覧タブで対象行に☑を入れてください（複数の検索をまたいで溜められます）。</div>';
    return;
  }
  if(gc) gc.textContent='選択 '+keys.length+'件。各行に改定単価と改定日を入力してください（上の「改定日を全行へ適用」でまとめて入力可）。区分=新規追加のみ なら更新行は作りません。';
  let html='<div class="card tablewrap"><table><thead><tr>'+
    '<th>アイテム</th><th>発注先</th><th>TID</th><th class="num">現行単価</th><th class="num">適用数量</th><th>区分</th><th>改定単価</th><th>新適用数量<br>(空=現行)</th><th>改定日</th></tr></thead><tbody>';
  keys.forEach(k=>{
    const r=SEL[k];
    html+='<tr data-k="'+esc(k)+'">'+
      '<td>'+esc(r.CODE)+(r.MPN?'<br><span class="hint">'+esc(r.MPN)+'</span>':'')+'</td>'+
      '<td>'+esc(r.VENDORNAME||r.VENDOR)+(r.VENDORNAME?'<br><span class="hint">'+esc(r.VENDOR)+'</span>':'')+'</td>'+
      '<td>'+esc(r.TID)+'</td>'+
      '<td class="num">'+esc(fmtPrice(r.PRICE))+'</td>'+
      '<td class="num">'+esc(r.TVOL)+'</td>'+
      '<td><select class="g-mode"><option value="update">価格改定(更新+新規)</option><option value="new">新規追加のみ</option></select></td>'+
      '<td><input type="number" step="any" class="gen-input g-price"></td>'+
      '<td><input type="number" step="any" class="gen-input g-tvol" placeholder="'+esc(r.TVOL)+'"></td>'+
      '<td><input type="date" class="g-date"></td>'+
    '</tr>';
  });
  html+='</tbody></table></div>';
  $('#genTable').innerHTML=html;
}
function applyDateAll(){
  const d=$('#kaitei').value; if(!d){alert('改定日を選択してください');return;}
  document.querySelectorAll('.g-date').forEach(x=>x.value=d);
}
function collectEdits(){
  const edits=[];
  document.querySelectorAll('#genTable tbody tr').forEach(tr=>{
    const k=tr.dataset.k, r=SEL[k];
    const price=tr.querySelector('.g-price').value;
    const date=tr.querySelector('.g-date').value;
    const tvol=tr.querySelector('.g-tvol').value;
    const mode=tr.querySelector('.g-mode').value;
    if(price===''||date==='') return;
    edits.push({current:r, kaitei_date:date, new_price:price, new_tvol:(tvol||null), mode:mode});
  });
  return edits;
}
async function preview(){
  const edits=collectEdits();
  if(!edits.length){$('#genMsg').textContent='改定単価と改定日を入力した行がありません。';return;}
  const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edits})}).then(r=>r.json());
  let html='<table><thead><tr><th>区分</th>'+r.columns.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  r.rows.forEach(row=>{
    const kind=row._kind||'';
    html+='<tr><td style="font-weight:700;color:'+(kind.indexOf('新規')>=0?'#1a7f37':'#c0392b')+'">'+esc(kind)+'</td>'+
      r.columns.map(c=>'<td class="'+((c==='PRICE'||c==='TVOL'||c==='SPRICE'||c==='TAXRATE')?'num':'')+'">'+esc((c==='PRICE'||c==='SPRICE')?fmtPrice(row[c]):row[c])+'</td>').join('')+'</tr>';
  });
  html+='</tbody></table>';
  $('#csvPreview').innerHTML='<div class="grp">生成プレビュー（'+r.rows.length+'行）</div><div class="card tablewrap">'+html+'</div>';
  $('#genMsg').textContent=r.rows.length+'行を生成しました。内容を確認しCSVダウンロードへ。';
}
async function download(){
  const edits=collectEdits();
  if(!edits.length){$('#genMsg').textContent='改定単価と改定日を入力した行がありません。';return;}
  const res=await fetch('/api/download_csv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edits,encoding:$('#enc').value})});
  const blob=await res.blob();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='tanka_import_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.csv';
  a.click();
  $('#genMsg').textContent='CSVをダウンロードしました。TPiCSのテキスト読込み（「同じキーがあれば上書きする」をオン）で取り込んでください。';
}

let IMPORT_EDITS=[];
async function exportXlsx(){
  const rows=Object.values(SEL).map(r=>({CODE:r.CODE,VENDOR:r.VENDOR}));
  if(!rows.length){ document.getElementById('expMsg').textContent='①で対象品目に☑を入れてください。'; return; }
  document.getElementById('expMsg').textContent='出力中…';
  const res=await fetch('/api/export_xlsx',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows})});
  if(!res.ok){ let m='出力に失敗'; try{m=(await res.json()).msg||m;}catch(e){} document.getElementById('expMsg').textContent=m; return; }
  const blob=await res.blob(); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='改定入力_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.xlsx'; a.click();
  document.getElementById('expMsg').textContent='Excelを出力しました。記入後、手順2で取込んでください。';
}
async function importXlsx(){
  const f=document.getElementById('xlsxfile').files[0];
  if(!f){ document.getElementById('impMsg').textContent='記入済みのExcelファイルを選んでください。'; return; }
  document.getElementById('impMsg').textContent='取込中…';
  const fd=new FormData(); fd.append('file', f);
  const r=await fetch('/api/import_xlsx',{method:'POST',body:fd}).then(r=>r.json()).catch(e=>({ok:false,msg:String(e)}));
  if(!r.ok){ document.getElementById('importPreview').innerHTML='<div class="card" style="padding:12px;color:var(--warn)">'+esc(r.msg)+'</div>'; return; }
  IMPORT_EDITS=r.edits||[];
  let html='<div class="grp">生成プレビュー（'+r.rows.length+'行 / 取込'+IMPORT_EDITS.length+'件'+(r.skipped?'・未記入スキップ'+r.skipped+'件':'')+'）</div><div class="card tablewrap"><table><thead><tr><th>区分</th>'+r.columns.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  r.rows.forEach(row=>{ const k=row._kind||''; html+='<tr><td style="font-weight:700;color:'+(k.indexOf("新規")>=0?"#1a7f37":"#c0392b")+'">'+esc(k)+'</td>'+r.columns.map(c=>'<td class="'+((c==='PRICE'||c==='TVOL'||c==='SPRICE'||c==='TAXRATE')?'num':'')+'">'+esc((c==='PRICE'||c==='SPRICE')?fmtPrice(row[c]):row[c])+'</td>').join('')+'</tr>'; });
  html+='</tbody></table></div>';
  document.getElementById('importPreview').innerHTML=html;
  document.getElementById('impDlBtn').disabled = r.rows.length===0;
  document.getElementById('impMsg').textContent = r.rows.length? '内容を確認し「CSVダウンロード」へ。' : '生成対象がありません（改定単価・改定日が未記入かもしれません）。';
}
async function downloadImportCsv(){
  if(!IMPORT_EDITS.length){ document.getElementById('impMsg').textContent='先にExcelを取込んでください。'; return; }
  const res=await fetch('/api/download_csv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edits:IMPORT_EDITS,encoding:document.getElementById('enc').value})});
  const blob=await res.blob(); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='tanka_import_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.csv'; a.click();
  document.getElementById('impMsg').textContent='CSVをダウンロードしました。TPiCSのテキスト読込み（「同じキーがあれば上書きする」をオン）で取り込んでください。';
}
async function showCols(){
  const r=await fetch('/api/status').then(r=>r.json());
  if(!r.schema){$('#viewResult').innerHTML='<div class="card" style="padding:12px">スキーマ情報を取得できませんでした。</div>';return;}
  const jp={tank:'単価マスター(XTANK)',head:'アイテム基本マスター(XHEAD)',item:'アイテム詳細マスター(XITEM)'};
  let html='<div class="grp">DB項目一覧（メーカー品目コードの実列名の確認用）</div>';
  html+='<p class="hint">自動検出された対応（MPN=メーカー品目コード／NAME=品名／LOTS=ロットサイズ）を確認できます。違う場合は config.ini の [columns] に例: <code>head_MPN = 実際の列名</code> を追記してください。</p>';
  for(const key in r.schema){
    const sc=r.schema[key];
    html+='<div class="card" style="padding:10px 14px;margin-bottom:8px"><div style="font-weight:700;color:var(--navy)">'+(jp[key]||key)+' <span class="hint">'+esc(sc.table)+'</span></div>'+
      '<div class="hint" style="margin:4px 0">自動検出: '+Object.entries(sc.map).map(([k,v])=>k+'→'+v).join(' / ')+'</div>'+
      '<div style="font-family:Consolas,monospace;font-size:12px">'+(sc.all&&sc.all.length?sc.all.map(esc).join('、 '):'(列情報なし)')+'</div></div>';
  }
  $('#viewResult').innerHTML=html;
  // 製造担当マスター(XSECT)のサンプルを追記表示（発注先名称の列を特定するため）
  try{
    const sm=await fetch('/api/sample?key=sect').then(r=>r.json());
    if(sm.ok){
      let t='<div class="card" style="padding:10px 14px;margin-bottom:8px"><div style="font-weight:700;color:var(--navy)">製造担当マスター(XSECT) サンプル '+esc(sm.table)+'</div>'+
        '<p class="hint" style="margin:4px 0">発注先コード(VENDOR)と一致する列と、発注先名称の列を見つけてください。設定は config.ini の [columns] に <code>sect_CODE = 列名</code> / <code>sect_NAME = 列名</code> で行います。</p>'+
        '<div class="tablewrap" style="max-height:40vh"><table><thead><tr>'+sm.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
      sm.rows.forEach(row=>{ t+='<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>'; });
      t+='</tbody></table></div></div>';
      $('#viewResult').insertAdjacentHTML('beforeend', t);
    }
  }catch(e){}
}

loadStatus();
updateCount();
</script>
