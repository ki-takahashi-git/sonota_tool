[app]
; demo=true にすると DB未接続でもサンプルデータで動作確認できます。
; 本番運用では demo=false にしてください。
demo = false
port = 5000
; 全員で1台を共有する場合は host = 0.0.0.0 にする（このPCだけなら 127.0.0.1）
host = 127.0.0.1
; 起動時にブラウザを自動で開く（サーバー常駐運用では false 推奨）
open_browser = true

[db]
server = YOUR_DB_SERVER_IP
port = 1433
database = TPICSDB_T
user = YOUR_DB_USER
password = YOUR_DB_PASSWORD
; auth = sql （ID/PW認証） または windows （Windows認証）
auth = sql
; pyodbc利用時のみ。pymssqlを使う場合は無視されます。
odbc_driver = ODBC Driver 17 for SQL Server

[columns]
; 列名が自動検出できない場合のみ上書き指定します（例: head_NAME = HINMEI）。
; 通常は空欄でOK。
