[app]
; demo=true にすると DB未接続でも内蔵サンプルBOMで動作確認できます。
; 本番運用では demo=false にしてください。
demo = false

[db]
server = YOUR_DB_SERVER_IP
port = 1433
database = TPICSDB_T
user = YOUR_DB_USER
password = YOUR_DB_PASSWORD
; auth = sql （ID/PW認証） または windows （Windows認証）
auth = sql
; pyodbc利用時のみ。pymssqlを使う場合は無視されます。
odbc_driver = ODBC Driver 17 for SQL Server
